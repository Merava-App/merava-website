<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes — merava for Business</title>
  <meta name="description" content="Add and manage your studio's classes.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="biz-page dash-page">

  <div class="app-shell" id="appShell">
    <div id="sidebarRoot"></div>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="app-page-header">
          <div>
            <h1>Classes</h1>
            <p class="app-page-sub">Add a class, then add specific dates and times as sessions on its page.</p>
          </div>
        </div>

        <section class="dash-card">
          <h2>Add a Class</h2>

          <form id="classForm" class="dash-form">
            <div class="form-grid">
              <label class="form-field">
                <span>Class title</span>
                <input type="text" name="title" required placeholder="Bouldering 101">
              </label>
              <label class="form-field">
                <span>Image URL</span>
                <input type="url" name="image" required placeholder="https://...">
              </label>
            </div>

            <label class="form-field">
              <span>Description</span>
              <textarea name="description" rows="3" required></textarea>
            </label>

            <div class="form-grid form-grid-4">
              <label class="form-field">
                <span>Default duration (min)</span>
                <input type="number" name="default_duration" min="0" required>
              </label>
              <label class="form-field">
                <span>Default capacity</span>
                <input type="number" name="default_capacity" min="0" required>
              </label>
              <label class="form-field">
                <span>Default instructor</span>
                <input type="text" name="default_instructor" required>
              </label>
              <label class="form-field">
                <span>Class price ($)</span>
                <input type="number" name="studio_class_price" min="0" step="0.01" required>
              </label>
            </div>
            <p class="field-note">Credits shown to customers are calculated automatically from this price.</p>

            <fieldset class="form-field">
              <legend>Tags <span class="required-note">(pick at least one)</span></legend>
              <div id="tagCheckboxes" class="tag-checkboxes"></div>
            </fieldset>

            <p id="classStatus" class="form-alert" role="status"></p>
            <button type="submit" id="classSubmitBtn" class="btn btn-primary">Add Class</button>
          </form>
        </section>

        <section class="dash-card">
          <h2>Your Classes</h2>
          <div id="classList" class="class-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/classes.js"></script>
</body>
</html>
