<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — merava for Business</title>
  <meta name="description" content="Manage your studio, classes, and sessions on merava.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="biz-page dash-page">

  <header class="dash-header">
    <div class="wrap dash-header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="2"/>
            <path d="M11 20V12L16 17L21 12V20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        merava <span class="dash-badge">Business</span>
      </a>

      <div class="dash-header-actions">
        <span id="dashUserEmail" class="dash-user-email"></span>
        <button id="signOutBtn" type="button" class="btn btn-ghost">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="wrap dash-main">
    <section id="studioSection" class="dash-card">
      <h2>Your Studio</h2>
      <p class="dash-sub">This profile is what customers see in the merava app.</p>

      <form id="studioForm" class="dash-form">
        <div class="form-grid">
          <label class="form-field">
            <span>Studio name</span>
            <input type="text" name="name" required placeholder="Climb On">
          </label>
          <label class="form-field">
            <span>Image URL</span>
            <input type="url" name="image" placeholder="https://...">
          </label>
        </div>

        <label class="form-field">
          <span>Address</span>
          <input type="text" name="address" required placeholder="123 King St West">
        </label>

        <div class="form-grid form-grid-3">
          <label class="form-field">
            <span>City</span>
            <input type="text" name="city">
          </label>
          <label class="form-field">
            <span>Province</span>
            <input type="text" name="province">
          </label>
          <label class="form-field">
            <span>Postal code</span>
            <input type="text" name="postal_code">
          </label>
        </div>

        <label class="form-field">
          <span>Country</span>
          <input type="text" name="country">
        </label>

        <label class="form-field">
          <span>Description</span>
          <textarea name="description" rows="4" placeholder="Tell customers what your studio is about"></textarea>
        </label>

        <p id="studioStatus" class="form-alert" role="status"></p>
        <button type="submit" id="studioSubmitBtn" class="btn btn-primary">Save Studio</button>
      </form>
    </section>

    <section id="classesSection" class="dash-card" hidden>
      <h2>Classes</h2>
      <p class="dash-sub">Add a class, then add specific dates and times as sessions below it.</p>

      <form id="classForm" class="dash-form">
        <div class="form-grid">
          <label class="form-field">
            <span>Class title</span>
            <input type="text" name="title" required placeholder="Bouldering 101">
          </label>
          <label class="form-field">
            <span>Image URL</span>
            <input type="url" name="image" placeholder="https://...">
          </label>
        </div>

        <label class="form-field">
          <span>Description</span>
          <textarea name="description" rows="3"></textarea>
        </label>

        <div class="form-grid form-grid-5">
          <label class="form-field">
            <span>Default credits</span>
            <input type="number" name="default_credit_cost" min="0" required>
          </label>
          <label class="form-field">
            <span>Default duration (min)</span>
            <input type="number" name="default_duration" min="0" required>
          </label>
          <label class="form-field">
            <span>Default capacity</span>
            <input type="number" name="default_capacity" min="0" required>
          </label>
          <label class="form-field">
            <span>Default instructor</span>
            <input type="text" name="default_instructor">
          </label>
          <label class="form-field">
            <span>Studio price ($)</span>
            <input type="number" name="studio_class_price" min="0" step="0.01" required>
          </label>
        </div>

        <fieldset class="form-field">
          <legend>Tags</legend>
          <div id="tagCheckboxes" class="tag-checkboxes"></div>
        </fieldset>

        <p id="classStatus" class="form-alert" role="status"></p>
        <button type="submit" id="classSubmitBtn" class="btn btn-primary">Add Class</button>
      </form>

      <div id="classList" class="class-list"></div>
    </section>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
