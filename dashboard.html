<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — merava for Business</title>
  <meta name="description" content="Your studio's classes, sessions, and bookings at a glance.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="biz-page dash-page">

  <div class="app-shell" id="appShell">
    <div id="sidebarRoot"></div>

    <main class="app-main">
      <div class="app-main-inner">
        <div class="app-page-header">
          <div>
            <h1 id="studioNameHeading">Dashboard</h1>
            <p class="app-page-sub">Here's how your studio is doing.</p>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <span class="stat-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="18" height="4.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="10.75" width="18" height="4.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="17.5" width="18" height="4.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
            </span>
            <span class="stat-card-value" id="statClasses">—</span>
            <span class="stat-card-label">Total Classes</span>
          </div>

          <div class="stat-card">
            <span class="stat-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="stat-card-value" id="statUpcoming">—</span>
            <span class="stat-card-label">Upcoming Sessions</span>
          </div>

          <div class="stat-card">
            <span class="stat-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 1 1 16 0 8 8 0 0 1-16 0Z" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 12.5l1.8 1.8L15 10.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="stat-card-value" id="statBookings">—</span>
            <span class="stat-card-label">Total Bookings</span>
          </div>

          <div class="stat-card">
            <span class="stat-card-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 17l5-5 4 4 8-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="stat-card-value" id="statMonthly">—</span>
            <span class="stat-card-label">Bookings This Month</span>
          </div>
        </div>

        <section class="dash-card">
          <h2>Upcoming Sessions</h2>
          <p class="dash-sub">Your studio's next scheduled sessions, soonest first.</p>
          <div id="upcomingList" class="upcoming-list"></div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
